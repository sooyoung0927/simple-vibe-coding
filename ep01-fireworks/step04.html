<!-- step04: 원이 목표 높이에 닿으면 사라지고, 그 자리에서 입자 50개가 사방으로 퍼진다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>불꽃놀이 step04</title>
<style>
  body { margin: 0; background: black; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  // 캔버스를 가져와서 화면 크기에 맞춘다
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // 원(폭죽)의 위치
  let x = canvas.width / 2;
  let y = canvas.height - 50;

  // 폭죽이 터질 높이 (화면 위에서 1/3 지점)
  let targetY = canvas.height / 3;

  // 터졌는지 여부
  let exploded = false;

  // 터진 뒤 퍼지는 입자들을 담는 배열
  let particles = [];

  // 원 하나를 그리는 함수
  function drawCircle(cx, cy, radius, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // 지금 원이 있는 자리에 입자 50개를 만든다
  function explode() {
    for (let i = 0; i < 50; i++) {
      // 0 ~ 360도 중 아무 방향이나 고른다
      const angle = Math.random() * Math.PI * 2;
      // 입자마다 빠르기를 조금씩 다르게 한다 (1 ~ 4)
      const speed = Math.random() * 3 + 1;

      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed, // 한 프레임에 가로로 움직일 양
        vy: Math.sin(angle) * speed  // 한 프레임에 세로로 움직일 양
      });
    }
  }

  // 한 프레임을 그리는 함수 (1초에 약 60번 불린다)
  function draw() {
    // 화면을 검은색으로 지운다
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 아직 안 터졌으면 원이 위로 올라간다
    if (exploded === false) {
      y = y - 5;
      drawCircle(x, y, 5, "white");

      // 목표 높이에 닿으면 터진다
      if (y <= targetY) {
        exploded = true;
        explode();
      }
    }

    // 입자들을 조금씩 움직이고 그린다
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x = p.x + p.vx;
      p.y = p.y + p.vy;
      drawCircle(p.x, p.y, 2, "gold");
    }

    // 다음 프레임에 draw를 또 불러 달라고 부탁한다
    requestAnimationFrame(draw);
  }

  draw();
</script>
</body>
</html>
