<!-- step06: 화면을 클릭하면 클릭한 곳 아래에서 폭죽이 올라가 클릭한 높이에서 터진다. -->
<!--         (아직은 폭죽이 하나뿐이라, 올라가는 중에 클릭하면 처음부터 다시 쏜다) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>불꽃놀이 step06</title>
<style>
  body { margin: 0; background: black; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  // 캔버스를 가져와서 화면 크기에 맞춘다
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // 원(폭죽)의 위치
  let x = canvas.width / 2;
  let y = canvas.height - 50;

  // 폭죽이 터질 높이 (화면 위에서 1/3 지점)
  let targetY = canvas.height / 3;

  // 터졌는지 여부
  let exploded = false;

  // 터진 뒤 퍼지는 입자들을 담는 배열
  let particles = [];

  // 원 하나를 그리는 함수
  function drawCircle(cx, cy, radius, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // 지금 원이 있는 자리에 입자 50개를 만든다
  function explode() {
    for (let i = 0; i < 50; i++) {
      // 0 ~ 360도 중 아무 방향이나 고른다
      const angle = Math.random() * Math.PI * 2;
      // 입자마다 빠르기를 조금씩 다르게 한다 (1 ~ 4)
      const speed = Math.random() * 3 + 1;

      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed, // 한 프레임에 가로로 움직일 양
        vy: Math.sin(angle) * speed, // 한 프레임에 세로로 움직일 양
        alpha: 1                     // 투명도 (1 = 또렷함, 0 = 안 보임)
      });
    }
  }

  // 한 프레임을 그리는 함수 (1초에 약 60번 불린다)
  function draw() {
    // 화면을 검은색으로 지운다
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 아직 안 터졌으면 원이 위로 올라간다
    if (exploded === false) {
      y = y - 5;
      drawCircle(x, y, 5, "white");

      // 목표 높이에 닿으면 터진다
      if (y <= targetY) {
        exploded = true;
        explode();
      }
    }

    // 입자들을 움직이고, 흐리게 만들고, 그린다
    // 뒤에서부터 도는 이유: 중간에 입자를 지워도 순서가 꼬이지 않게 하려고
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x = p.x + p.vx;
      p.y = p.y + p.vy;
      p.alpha = p.alpha - 0.01;

      if (p.alpha > 0) {
        ctx.globalAlpha = p.alpha;
        drawCircle(p.x, p.y, 2, "gold");
      } else {
        // 완전히 사라진 입자는 배열에서 지운다
        particles.splice(i, 1);
      }
    }
    // 다른 그림에 영향이 없도록 투명도를 원래대로 돌려 놓는다
    ctx.globalAlpha = 1;

    // 다음 프레임에 draw를 또 불러 달라고 부탁한다
    requestAnimationFrame(draw);
  }

  // 화면을 클릭하면 그 위치로 폭죽을 다시 쏜다
  canvas.addEventListener("click", function (event) {
    x = event.clientX;        // 클릭한 가로 위치에서
    y = canvas.height;        // 화면 맨 아래부터 출발해서
    targetY = event.clientY;  // 클릭한 높이에서 터진다
    exploded = false;
  });

  draw();
</script>
</body>
</html>
