<!-- index: step01 ~ step08을 이전/다음 버튼으로 하나씩 넘겨보는 페이지. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep02 눈 내리기 - 단계별 보기</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px;
  }
  button {
    font-size: 16px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:disabled {
    cursor: default;
    opacity: 0.4;
  }
  #label {
    font-weight: bold;
    min-width: 110px;
    text-align: center;
  }
  #desc {
    margin: 0 16px 12px;
    text-align: center;
    color: #ccc;
  }
  iframe {
    flex: 1;
    border: none;
  }
</style>
</head>
<body>
<div class="bar">
  <button id="prev">◀ 이전</button>
  <span id="label"></span>
  <button id="next">다음 ▶</button>
</div>
<p id="desc"></p>
<iframe id="frame"></iframe>

<script>
  // 단계 목록 (파일 이름과 설명)
  const steps = [
    { file: "step01.html", desc: "어두운 밤 하늘 위쪽에 하얀 원 하나(눈송이)를 그린다." },
    { file: "step02.html", desc: "눈송이가 일정한 속도로 아래로 떨어진다." },
    { file: "step03.html", desc: "바닥을 지나가면 다시 위에서 나타난다." },
    { file: "step04.html", desc: "눈송이를 150개로 늘려 화면에 흩뿌린다." },
    { file: "step05.html", desc: "눈송이마다 크기가 랜덤, 큰 눈송이일수록 빨리 떨어진다." },
    { file: "step06.html", desc: "바람에 흔들리듯 좌우로 살랑살랑 움직인다." },
    { file: "step07.html", desc: "투명도가 제각각이고 가장자리가 부드럽게 빛난다." },
    { file: "step08.html", desc: "마무리: 재등장 위치 랜덤, 옆으로 나간 눈 처리, 창 크기 대응. 완성!" }
  ];

  // 지금 보고 있는 단계 번호 (0부터 시작)
  let current = 0;

  const frame = document.getElementById("frame");
  const label = document.getElementById("label");
  const desc = document.getElementById("desc");
  const prevButton = document.getElementById("prev");
  const nextButton = document.getElementById("next");

  // 현재 단계를 화면에 보여 준다
  function show() {
    frame.src = steps[current].file;
    label.textContent = "step " + (current + 1) + " / " + steps.length;
    desc.textContent = steps[current].desc;

    // 처음이면 이전 버튼, 마지막이면 다음 버튼을 끈다
    prevButton.disabled = (current === 0);
    nextButton.disabled = (current === steps.length - 1);
  }

  prevButton.addEventListener("click", function () {
    if (current > 0) {
      current = current - 1;
      show();
    }
  });

  nextButton.addEventListener("click", function () {
    if (current < steps.length - 1) {
      current = current + 1;
      show();
    }
  });

  show();
</script>
</body>
</html>
