<!-- step01: 어두운 밤 하늘 캔버스의 위쪽 가운데에 하얀 원 하나(눈송이)를 그린다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep02 눈 내리기 - step01</title>
<style>
  body { margin: 0; background: #0b1530; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// 눈송이 하나
const flake = { x: canvas.width / 2, y: 20, radius: 6 };

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
  ctx.fill();
}

draw();
</script>
</body>
</html>
