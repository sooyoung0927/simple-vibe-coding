<!-- step06: 눈송이가 바람에 흔들리듯 좌우로 살랑살랑 움직인다. (sin 사용) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep02 눈 내리기 - step06</title>
<style>
  body { margin: 0; background: #0b1530; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// 눈송이 여러 개를 배열에 담는다
const flakes = [];
for (let i = 0; i < 150; i++) {
  const radius = 1 + Math.random() * 4;   // 크기 랜덤
  flakes.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    radius: radius,
    speed: 0.5 + radius * 0.5,   // 큰 눈송이는 가까이 있는 것처럼 빨리 떨어진다
    angle: Math.random() * Math.PI * 2,   // 흔들림 시작 위치
    sway: 0.3 + Math.random() * 0.7       // 흔들림 빠르기
  });
}

function update() {
  for (const flake of flakes) {
    flake.y = flake.y + flake.speed;
    // 좌우로 흔들린다
    flake.angle = flake.angle + 0.02 * flake.sway;
    flake.x = flake.x + Math.sin(flake.angle) * flake.sway;
    // 바닥을 지나가면 위로 되돌린다
    if (flake.y > canvas.height + flake.radius) {
      flake.y = -flake.radius;
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";
  for (const flake of flakes) {
    ctx.beginPath();
    ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
