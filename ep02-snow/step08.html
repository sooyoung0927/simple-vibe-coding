<!-- step08: 마무리 다듬기 - 다시 내려올 때 위치를 새로 정하고, 옆으로 나간 눈은 반대편에서 나타나고, 창 크기가 바뀌어도 맞춘다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep02 눈 내리기 - step08</title>
<style>
  body { margin: 0; background: #0b1530; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// 눈송이 여러 개를 배열에 담는다
const flakes = [];
for (let i = 0; i < 150; i++) {
  const radius = 1 + Math.random() * 4;   // 크기 랜덤
  flakes.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    radius: radius,
    speed: 0.5 + radius * 0.5,   // 큰 눈송이는 가까이 있는 것처럼 빨리 떨어진다
    angle: Math.random() * Math.PI * 2,   // 흔들림 시작 위치
    sway: 0.3 + Math.random() * 0.7,      // 흔들림 빠르기
    alpha: 0.4 + Math.random() * 0.6      // 투명도
  });
}

function update() {
  for (const flake of flakes) {
    flake.y = flake.y + flake.speed;
    // 좌우로 흔들린다
    flake.angle = flake.angle + 0.02 * flake.sway;
    flake.x = flake.x + Math.sin(flake.angle) * flake.sway;
    // 바닥을 지나가면 위로 되돌린다 (x도 새로 정해서 같은 모양이 반복되지 않게)
    if (flake.y > canvas.height + flake.radius) {
      flake.y = -flake.radius;
      flake.x = Math.random() * canvas.width;
    }
    // 옆으로 흔들려 화면 밖으로 나가면 반대편으로 넘어온다
    if (flake.x < -10) flake.x = canvas.width + 10;
    if (flake.x > canvas.width + 10) flake.x = -10;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.shadowColor = "white";
  ctx.shadowBlur = 6;
  for (const flake of flakes) {
    ctx.fillStyle = "rgba(255, 255, 255, " + flake.alpha + ")";
    ctx.beginPath();
    ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

// 창 크기가 바뀌면 캔버스도 맞춘다
window.addEventListener("resize", function () {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
