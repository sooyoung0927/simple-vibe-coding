<!-- index: step01 ~ step08을 이전/다음 버튼으로 하나씩 넘겨보는 페이지. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep03 공 튀기기 - 단계별 보기</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px;
  }
  button {
    font-size: 16px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:disabled {
    cursor: default;
    opacity: 0.4;
  }
  #label {
    font-weight: bold;
    min-width: 110px;
    text-align: center;
  }
  #desc {
    margin: 0 16px 12px;
    text-align: center;
    color: #ccc;
  }
  iframe {
    flex: 1;
    border: none;
  }
</style>
</head>
<body>
<div class="bar">
  <button id="prev">◀ 이전</button>
  <span id="label"></span>
  <button id="next">다음 ▶</button>
</div>
<p id="desc"></p>
<iframe id="frame"></iframe>

<script>
  // 단계 목록 (파일 이름과 설명)
  const steps = [
    { file: "step01.html", desc: "어두운 배경 캔버스 위쪽에 빨간 원 하나(공)를 그린다." },
    { file: "step02.html", desc: "중력을 더해서 공이 점점 빨라지며 떨어진다." },
    { file: "step03.html", desc: "바닥을 그리고, 닿으면 속도가 줄어든 채로 튀어 오른다." },
    { file: "step04.html", desc: "튀는 높이가 아주 작아지면 멈춰서 바닥에 가만히 놓인다." },
    { file: "step05.html", desc: "바닥에 그림자를 깔아서, 공이 높을수록 작고 옅게 보이게 한다." },
    { file: "step06.html", desc: "부딪힐 때 납작하게 찌그러지고, 빠르게 움직일 땐 길쭉하게 늘어난다." },
    { file: "step07.html", desc: "공에 빛 받는 입체감(그라데이션)과 하이라이트를 입힌다." },
    { file: "step08.html", desc: "마무리: 클릭하면 던지기, 좌우 벽 튕김, 바닥 마찰, 굴러가는 줄무늬, 창 크기 대응." }
  ];

  // 지금 보고 있는 단계 번호 (0부터 시작)
  let current = 0;

  const frame = document.getElementById("frame");
  const label = document.getElementById("label");
  const desc = document.getElementById("desc");
  const prevButton = document.getElementById("prev");
  const nextButton = document.getElementById("next");

  // 현재 단계를 화면에 보여 준다
  function show() {
    frame.src = steps[current].file;
    label.textContent = "step " + (current + 1) + " / " + steps.length;
    desc.textContent = steps[current].desc;

    // 처음이면 이전 버튼, 마지막이면 다음 버튼을 끈다
    prevButton.disabled = (current === 0);
    nextButton.disabled = (current === steps.length - 1);
  }

  prevButton.addEventListener("click", function () {
    if (current > 0) {
      current = current - 1;
      show();
    }
  });

  nextButton.addEventListener("click", function () {
    if (current < steps.length - 1) {
      current = current + 1;
      show();
    }
  });

  show();
</script>
</body>
</html>
