<!-- step01: 어두운 배경 캔버스 위쪽에 빨간 원 하나(공)를 그린다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep03 공 튀기기 - step01</title>
<style>
  body { margin: 0; background: #1d2433; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// 공 하나
const ball = { x: canvas.width / 2, y: 60, r: 30 };

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#e63946";
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
}

draw();
</script>
</body>
</html>
