<!-- index: step01 ~ step08을 이전/다음 버튼으로 하나씩 넘겨보는 페이지. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep04 아날로그 시계 - 단계별 보기</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px;
  }
  button {
    font-size: 16px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:disabled {
    cursor: default;
    opacity: 0.4;
  }
  #label {
    font-weight: bold;
    min-width: 110px;
    text-align: center;
  }
  #desc {
    margin: 0 16px 12px;
    text-align: center;
    color: #ccc;
  }
  iframe {
    flex: 1;
    border: none;
  }
</style>
</head>
<body>
<div class="bar">
  <button id="prev">◀ 이전</button>
  <span id="label"></span>
  <button id="next">다음 ▶</button>
</div>
<p id="desc"></p>
<iframe id="frame"></iframe>

<script>
  // 단계 목록 (파일 이름과 설명)
  const steps = [
    { file: "step01.html", desc: "베이지색 둥근 시계 판(원) 하나를 어두운 배경 한가운데에 그린다." },
    { file: "step02.html", desc: "시계 판 둘레에 12개의 눈금을 돌려가며 그린다." },
    { file: "step03.html", desc: "현재 시각을 읽어서 시침·분침·초침 세 개를 그린다. (초침은 1초마다 뚝뚝 점프)" },
    { file: "step04.html", desc: "밀리초까지 계산해서 세 바늘이 끊김 없이 부드럽게 흐르고, 시침도 분에 따라 조금씩 움직인다." },
    { file: "step05.html", desc: "초침을 다시 째깍 움직임으로 바꾸되, 튕기듯 살짝 지나쳤다가 돌아오는 이징을 준다." },
    { file: "step06.html", desc: "바늘 아래에 그림자를 깔아서 판 위에 떠 있는 느낌을 낸다." },
    { file: "step07.html", desc: "테두리에 금속 느낌 그라데이션을 넣고, 위쪽에 유리 반사를 얹어 입체감을 준다." },
    { file: "step08.html", desc: "마무리: 1~12 숫자, 60개 분 눈금, 가운데 캡, 초침 꼬리, 창 크기 대응을 더한다." }
  ];

  // 지금 보고 있는 단계 번호 (0부터 시작)
  let current = 0;

  const frame = document.getElementById("frame");
  const label = document.getElementById("label");
  const desc = document.getElementById("desc");
  const prevButton = document.getElementById("prev");
  const nextButton = document.getElementById("next");

  // 현재 단계를 화면에 보여 준다
  function show() {
    frame.src = steps[current].file;
    label.textContent = "step " + (current + 1) + " / " + steps.length;
    desc.textContent = steps[current].desc;

    // 처음이면 이전 버튼, 마지막이면 다음 버튼을 끈다
    prevButton.disabled = (current === 0);
    nextButton.disabled = (current === steps.length - 1);
  }

  prevButton.addEventListener("click", function () {
    if (current > 0) {
      current = current - 1;
      show();
    }
  });

  nextButton.addEventListener("click", function () {
    if (current < steps.length - 1) {
      current = current + 1;
      show();
    }
  });

  show();
</script>
</body>
</html>
