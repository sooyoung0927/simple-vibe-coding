<!-- step08: 마무리: 1~12 숫자, 60개 분 눈금, 가운데 캡, 초침 꼬리, 창 크기 대응을 더한다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep04 아날로그 시계 - step08</title>
<style>
  body { margin: 0; background: #1d2433; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const TWO_PI = Math.PI * 2;

// 창 크기가 바뀌면 캔버스도 다시 맞춘다
window.addEventListener("resize", function () {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// 바늘 하나를 그린다 (angle: 12시 방향이 0, 시계 방향으로 증가)
function drawHand(angle, length, width, color, tail) {
  ctx.save();
  ctx.rotate(angle);
  ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
  ctx.shadowBlur = 8;
  ctx.shadowOffsetX = 4;
  ctx.shadowOffsetY = 6;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, tail);
  ctx.lineTo(0, -length);
  ctx.stroke();
  ctx.restore();
}

// 0~1 값을 받아 목표를 살짝 지나쳤다가 돌아오는 값으로 바꿔 주는 이징
function easeOutBack(p) {
  const c1 = 2.5;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 시계 판 중심과 반지름
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = Math.min(canvas.width, canvas.height) * 0.4;

  ctx.save();
  ctx.translate(cx, cy);

  // 테두리: 위쪽은 밝고 아래쪽은 어두운 금속 느낌
  const rim = ctx.createLinearGradient(0, -r, 0, r);
  rim.addColorStop(0, "#f2f2f2");
  rim.addColorStop(0.5, "#8d949e");
  rim.addColorStop(1, "#4a5059");
  ctx.fillStyle = rim;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, TWO_PI);
  ctx.fill();

  // 시계 판
  ctx.fillStyle = "#f5f1e6";
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.93, 0, TWO_PI);
  ctx.fill();

  // 눈금 60개 (5번째마다 굵고 길게)
  for (let i = 0; i < 60; i++) {
    const big = (i % 5 === 0);
    ctx.save();
    ctx.rotate(i / 60 * TWO_PI);
    ctx.strokeStyle = "#333";
    ctx.lineWidth = big ? r * 0.03 : r * 0.01;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.88);
    ctx.lineTo(0, big ? -r * 0.78 : -r * 0.83);
    ctx.stroke();
    ctx.restore();
  }

  // 숫자 1~12
  ctx.fillStyle = "#222";
  ctx.font = "bold " + Math.round(r * 0.13) + "px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (let n = 1; n <= 12; n++) {
    const a = n / 12 * TWO_PI;
    ctx.fillText(n, Math.sin(a) * r * 0.66, -Math.cos(a) * r * 0.66);
  }

  // 현재 시각
  const now = new Date();
  const h = now.getHours() % 12;
  const m = now.getMinutes();
  const s = now.getSeconds();
  const ms = now.getMilliseconds();

  // 초 = 지금까지 흐른 초 (소수점 포함)
  const sec = s + ms / 1000;
  // 분 = 초가 쌓인 만큼 조금씩 이동
  const min = m + sec / 60;
  // 시 = 분이 쌓인 만큼 조금씩 이동
  const hour = h + min / 60;

  // 초침은 째깍: 0.25초 동안 빠르게 한 칸 움직이고 나머지는 멈춘다
  const p = Math.min(ms / 250, 1);
  const tick = s + easeOutBack(p);

  drawHand(hour / 12 * TWO_PI, r * 0.5, r * 0.05, "#222", 0);
  drawHand(min / 60 * TWO_PI, r * 0.72, r * 0.035, "#222", 0);
  drawHand(tick / 60 * TWO_PI, r * 0.8, r * 0.015, "#d62828", r * 0.15);

  // 가운데 캡
  ctx.fillStyle = "#d62828";
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.04, 0, TWO_PI);
  ctx.fill();

  // 유리 반사: 위쪽에 투명한 흰색 반원
  const glass = ctx.createLinearGradient(0, -r * 0.93, 0, 0);
  glass.addColorStop(0, "rgba(255, 255, 255, 0.35)");
  glass.addColorStop(1, "rgba(255, 255, 255, 0)");
  ctx.fillStyle = glass;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.93, Math.PI, TWO_PI);
  ctx.fill();

  ctx.restore();
}

// 매 프레임 다시 그린다
function loop() {
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
