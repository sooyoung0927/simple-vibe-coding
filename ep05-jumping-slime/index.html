<!-- index: step01 ~ step08을 이전/다음 버튼으로 하나씩 넘겨보는 페이지. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep05 점프하는 슬라임 - 단계별 보기</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px;
  }
  button {
    font-size: 16px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:disabled {
    cursor: default;
    opacity: 0.4;
  }
  #label {
    font-weight: bold;
    min-width: 110px;
    text-align: center;
  }
  #desc {
    margin: 0 16px 12px;
    text-align: center;
    color: #ccc;
  }
  iframe {
    flex: 1;
    border: none;
  }
</style>
</head>
<body>
<div class="bar">
  <button id="prev">◀ 이전</button>
  <span id="label"></span>
  <button id="next">다음 ▶</button>
</div>
<p id="desc"></p>
<iframe id="frame"></iframe>

<script>
  // 단계 목록 (파일 이름과 설명)
  const steps = [
    { file: "step01.html", desc: "원 하나(슬라임)를 바닥 위에 그린다." },
    { file: "step02.html", desc: "중력을 줘서 슬라임이 올라갔다 내려오며 통통 뛴다. (속도에 가속이 붙는다)" },
    { file: "step03.html", desc: "바닥에 그림자를 깔고, 높이 뜰수록 작고 연하게 만든다." },
    { file: "step04.html", desc: "날 때는 세로로 길쭉, 착지할 때는 납작하게 찌그러졌다 돌아오는 눌림/늘어남을 준다." },
    { file: "step05.html", desc: "쉬는 시간, 점프 힘, 가로 방향을 무작위로 바꾸고 벽에서 튕기게 한다." },
    { file: "step06.html", desc: "눈을 달아서 움직이는 방향을 쳐다보게 한다." },
    { file: "step07.html", desc: "착지할 때 먼지 입자가 튀어 올랐다가 서서히 사라진다." },
    { file: "step08.html", desc: "마무리: 점프 전 웅크리기, 눈 깜빡임, 젤리 그라데이션·하이라이트, 창 크기 대응을 더한다." }
  ];

  // 지금 보고 있는 단계 번호 (0부터 시작)
  let current = 0;

  const frame = document.getElementById("frame");
  const label = document.getElementById("label");
  const desc = document.getElementById("desc");
  const prevButton = document.getElementById("prev");
  const nextButton = document.getElementById("next");

  // 현재 단계를 화면에 보여 준다
  function show() {
    frame.src = steps[current].file;
    label.textContent = "step " + (current + 1) + " / " + steps.length;
    desc.textContent = steps[current].desc;

    // 처음이면 이전 버튼, 마지막이면 다음 버튼을 끈다
    prevButton.disabled = (current === 0);
    nextButton.disabled = (current === steps.length - 1);
  }

  prevButton.addEventListener("click", function () {
    if (current > 0) {
      current = current - 1;
      show();
    }
  });

  nextButton.addEventListener("click", function () {
    if (current < steps.length - 1) {
      current = current + 1;
      show();
    }
  });

  show();
</script>
</body>
</html>
