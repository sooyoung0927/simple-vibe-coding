<!-- step01: 원 하나(슬라임)를 바닥 위에 그린다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep05 점프하는 슬라임 - step01</title>
<style>
  body { margin: 0; background: #1f2a44; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const groundY = canvas.height * 0.7;   // 바닥 높이
const R = 50;                          // 슬라임 반지름

let x = canvas.width / 2;
let y = groundY;   // 슬라임의 발(맨 아래) 위치

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 바닥 선
  ctx.fillStyle = "#2c3a5c";
  ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
  // 슬라임 (원 하나)
  ctx.fillStyle = "#6fdc7a";
  ctx.beginPath();
  ctx.arc(x, y - R, R, 0, Math.PI * 2);
  ctx.fill();
}

draw();
</script>
</body>
</html>
