<!-- step07: 착지할 때 먼지 입자가 튀어 올랐다가 서서히 사라진다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep05 점프하는 슬라임 - step07</title>
<style>
  body { margin: 0; background: #1f2a44; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const groundY = canvas.height * 0.7;   // 바닥 높이
const R = 50;                          // 슬라임 반지름

let x = canvas.width / 2;
let y = groundY;
let vy = 0;                // 세로 속도 (위로 갈수록 음수)
let vx = 0;                // 가로 속도
let wait = 30;             // 다음 점프까지 쉬는 프레임 수
let onGround = true;
const dust = [];           // 착지할 때 튀는 먼지들
const gravity = 0.8;       // 중력: 매 프레임 속도가 늘어난다

let squash = 0;             // 착지할 때 납작해지는 정도 (점점 0으로 돌아옴)

// min ~ max 사이의 무작위 숫자
function random(min, max) {
  return min + Math.random() * (max - min);
}

function update() {
  squash *= 0.85;          // 납작함이 서서히 풀린다

  if (onGround) {
    wait -= 1;
    if (wait <= 0) {       // 쉬는 시간이 끝나면 무작위 힘으로 점프
      vy = -random(12, 20);
      vx = random(-4, 4);
      onGround = false;
    }
    return;
  }

  vy += gravity;
  y += vy;
  x += vx;
  // 양쪽 벽에 닿으면 튕겨 나온다
  if (x < R || x > canvas.width - R) {
    vx = -vx;
    x = Math.max(R, Math.min(canvas.width - R, x));
  }
  if (y >= groundY) {      // 착지
    y = groundY;
    vy = 0;
    vx = 0;
    squash = 0.35;
    onGround = true;
    wait = random(20, 70);
    // 양옆으로 먼지를 흩뿌린다
    for (let i = 0; i < 10; i++) {
      const dir = i % 2 === 0 ? -1 : 1;
      dust.push({
        x: x + dir * random(0, R * 0.8),
        y: groundY,
        vx: dir * random(0.5, 3),
        vy: -random(0.5, 2.5),
        size: random(3, 7),
        life: 1
      });
    }
  }
}

// 먼지: 위로 떠오르며 점점 사라진다
function updateDust() {
  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.x += d.vx;
    d.y += d.vy;
    d.vy += 0.08;
    d.vx *= 0.96;
    d.life -= 0.025;
    if (d.life <= 0) dust.splice(i, 1);
  }
}

function drawDust() {
  for (const d of dust) {
    ctx.fillStyle = "rgba(220, 230, 255, " + (d.life * 0.6) + ")";
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size * d.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#2c3a5c";
  ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

  // 그림자: 높이 뜰수록 작고 연해진다
  const height = groundY - y;
  const far = Math.min(height / 200, 1);   // 0(바닥) ~ 1(가장 높음)
  ctx.fillStyle = "rgba(0, 0, 0, " + (0.35 - far * 0.2) + ")";
  ctx.beginPath();
  ctx.ellipse(x, groundY + 6, R * (1 - far * 0.4), 10 * (1 - far * 0.4), 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#6fdc7a";
  // 속도가 빠를수록 세로로 길쭉, 착지하면 납작
  const stretch = Math.min(Math.abs(vy) * 0.015, 0.25);
  const sy = 1 + stretch - squash;
  const sx = 1 / sy;                       // 세로가 줄면 가로가 늘어난다
  ctx.beginPath();
  ctx.ellipse(x, y - R * sy, R * sx, R * sy, 0, 0, Math.PI * 2);
  ctx.fill();

  // 눈: 움직이는 방향을 쳐다본다
  const cy = y - R * sy;
  const look = vx * 1.5;                       // 가로로 쳐다보는 정도
  const lookUp = onGround ? 0 : Math.max(-3, Math.min(3, vy * 0.3));
  for (const side of [-1, 1]) {
    const ex = x + side * R * 0.35 * sx + look * 0.5;
    const ey = cy - R * 0.1 * sy;
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.ellipse(ex, ey, 10, 12 * sy, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#1f2a44";
    ctx.beginPath();
    ctx.arc(ex + look * 0.5, ey + lookUp, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  update();
  updateDust();
  draw();
  drawDust();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
