<!-- index: step01 ~ step08을 이전/다음 버튼으로 하나씩 넘겨보는 페이지. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep06 물결 파문 - 단계별 보기</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px;
  }
  button {
    font-size: 16px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:disabled {
    cursor: default;
    opacity: 0.4;
  }
  #label {
    font-weight: bold;
    min-width: 110px;
    text-align: center;
  }
  #desc {
    margin: 0 16px 12px;
    text-align: center;
    color: #ccc;
  }
  iframe {
    flex: 1;
    border: none;
  }
</style>
</head>
<body>
<div class="bar">
  <button id="prev">◀ 이전</button>
  <span id="label"></span>
  <button id="next">다음 ▶</button>
</div>
<p id="desc"></p>
<iframe id="frame"></iframe>

<script>
  // 단계 목록 (파일 이름과 설명)
  const steps = [
    { file: "step01.html", desc: "원 하나(파문의 고리)를 화면 가운데 그린다." },
    { file: "step02.html", desc: "고리가 프레임마다 조금씩 커져서 퍼져 나간다. (끝까지 퍼지면 다시 시작)" },
    { file: "step03.html", desc: "퍼질수록 고리가 서서히 투명해진다. (페이드 아웃)" },
    { file: "step04.html", desc: "화면을 클릭한 자리에서 파문이 생긴다. (여러 개를 동시에 관리)" },
    { file: "step05.html", desc: "한 번 클릭에 고리 3개가 간격을 두고 따라 퍼진다. (진짜 물결은 겹겹이)" },
    { file: "step06.html", desc: "고리가 처음엔 빠르게 퍼지다 점점 느려진다. (이징: 감속)" },
    { file: "step07.html", desc: "빗방울이 무작위 위치·크기·속도·색으로 저절로 떨어진다." },
    { file: "step08.html", desc: "마무리: 물빛 배경, 원근감 있는 타원, 고리가 얇아지는 선, 중심 반짝임, 창 크기 대응." },
  ];

  // 지금 보고 있는 단계 번호 (0부터 시작)
  let current = 0;

  const frame = document.getElementById("frame");
  const label = document.getElementById("label");
  const desc = document.getElementById("desc");
  const prevButton = document.getElementById("prev");
  const nextButton = document.getElementById("next");

  // 현재 단계를 화면에 보여 준다
  function show() {
    frame.src = steps[current].file;
    label.textContent = "step " + (current + 1) + " / " + steps.length;
    desc.textContent = steps[current].desc;

    // 처음이면 이전 버튼, 마지막이면 다음 버튼을 끈다
    prevButton.disabled = (current === 0);
    nextButton.disabled = (current === steps.length - 1);
  }

  prevButton.addEventListener("click", function () {
    if (current > 0) {
      current = current - 1;
      show();
    }
  });

  nextButton.addEventListener("click", function () {
    if (current < steps.length - 1) {
      current = current + 1;
      show();
    }
  });

  show();
</script>
</body>
</html>
