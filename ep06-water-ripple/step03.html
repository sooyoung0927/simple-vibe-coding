<!-- step03: 퍼질수록 고리가 서서히 투명해진다. (페이드 아웃) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep06 물결 파문 - step03</title>
<style>
  body { margin: 0; background: #0b2540; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const maxR = 200;   // 최대 반지름
let r = 0;          // 지금 반지름

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 1 - r / maxR;   // 멀리 퍼질수록 투명
  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(canvas.width / 2, canvas.height / 2, r, 0, Math.PI * 2);
  ctx.stroke();
}

function loop() {
  r += 1.5;
  if (r > maxR) r = 0;
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
