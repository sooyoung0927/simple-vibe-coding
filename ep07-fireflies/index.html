<!-- index: step01 ~ step08을 이전/다음 버튼으로 하나씩 넘겨보는 페이지. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep07 반딧불이 - 단계별 보기</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px;
  }
  button {
    font-size: 16px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:disabled {
    cursor: default;
    opacity: 0.4;
  }
  #label {
    font-weight: bold;
    min-width: 110px;
    text-align: center;
  }
  #desc {
    margin: 0 16px 12px;
    text-align: center;
    color: #ccc;
  }
  iframe {
    flex: 1;
    border: none;
  }
</style>
</head>
<body>
<div class="bar">
  <button id="prev">◀ 이전</button>
  <span id="label"></span>
  <button id="next">다음 ▶</button>
</div>
<p id="desc"></p>
<iframe id="frame"></iframe>

<script>
  // 단계 목록 (파일 이름과 설명)
  const steps = [
    { file: "step01.html", desc: "원 하나(반딧불이 몸)를 화면 가운데 그린다." },
    { file: "step02.html", desc: "원이 프레임마다 앞으로 움직인다. (화면 밖으로 나가면 반대쪽에서 나타남)" },
    { file: "step03.html", desc: "방향이 조금씩 랜덤하게 틀어져서 흔들흔들 떠다닌다. (부드러운 방향 변화)" },
    { file: "step04.html", desc: "원 둘레에 부드러운 빛번짐(글로우)을 더한다. (방사형 그라데이션)" },
    { file: "step05.html", desc: "빛이 사인파로 부드럽게 깜빡인다. (밝아졌다 어두워졌다)" },
    { file: "step06.html", desc: "반딧불이를 40마리로 늘린다. 크기·속도·색·깜빡이는 타이밍이 제각각." },
    { file: "step07.html", desc: "지나간 자리에 옅은 잔상(꼬리)이 남는다. (화면을 지우지 않고 어둡게 덮기)" },
    { file: "step08.html", desc: "마무리: 밤하늘 배경과 풀숲 실루엣, 하얀 중심점, 숨쉬듯 깜빡임, 위아래 일렁임, 부드러운 방향 전환, 창 크기 대응." },
  ];

  // 지금 보고 있는 단계 번호 (0부터 시작)
  let current = 0;

  const frame = document.getElementById("frame");
  const label = document.getElementById("label");
  const desc = document.getElementById("desc");
  const prevButton = document.getElementById("prev");
  const nextButton = document.getElementById("next");

  // 현재 단계를 화면에 보여 준다
  function show() {
    frame.src = steps[current].file;
    label.textContent = "step " + (current + 1) + " / " + steps.length;
    desc.textContent = steps[current].desc;

    // 처음이면 이전 버튼, 마지막이면 다음 버튼을 끈다
    prevButton.disabled = (current === 0);
    nextButton.disabled = (current === steps.length - 1);
  }

  prevButton.addEventListener("click", function () {
    if (current > 0) {
      current = current - 1;
      show();
    }
  });

  nextButton.addEventListener("click", function () {
    if (current < steps.length - 1) {
      current = current + 1;
      show();
    }
  });

  show();
</script>
</body>
</html>
