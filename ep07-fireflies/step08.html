<!-- step08: 마무리: 밤하늘 배경과 풀숲 실루엣, 하얀 중심점, 느긋한 깜빡임(숨쉬듯), 위아래 일렁임, 부드러운 방향 전환, 창 크기 대응. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ep07 반딧불이 - step08</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(#050a14, #0b1a22 70%, #0f2a1c);
  }
  canvas { display: block; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="g"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
// 풀숲은 반딧불이 위에 따로 겹쳐 둔 캔버스에 그린다 (잔상 지우기에 안 지워지도록)
const grassCanvas = document.getElementById("g");
const gctx = grassCanvas.getContext("2d");

// 풀숲 실루엣: 한 번만 무작위로 만들어 둔다
const grass = [];
for (let x = 0; x < 3000; x += 6) {
  grass.push({ x: x, h: 30 + Math.random() * 50, lean: (Math.random() - 0.5) * 20 });
}

function drawGrass() {
  gctx.clearRect(0, 0, grassCanvas.width, grassCanvas.height);
  gctx.fillStyle = "#04100a";
  for (const g of grass) {
    const base = canvas.height;
    gctx.beginPath();
    gctx.moveTo(g.x - 4, base);
    gctx.lineTo(g.x + g.lean, base - g.h);
    gctx.lineTo(g.x + 4, base);
    gctx.fill();
  }
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  grassCanvas.width = window.innerWidth;
  grassCanvas.height = window.innerHeight;
  drawGrass();
}

resize();
window.addEventListener("resize", resize);

function makeFirefly() {
  return {
    x: Math.random() * canvas.width,
    y: canvas.height * (0.2 + Math.random() * 0.7),  // 위쪽보다 풀숲 쪽에 많이
    angle: Math.random() * Math.PI * 2,
    turn: 0,                                // 방향이 바뀌는 속도 (관성)
    speed: 0.2 + Math.random() * 0.6,
    size: 10 + Math.random() * 16,
    hue: 65 + Math.random() * 30,
    time: Math.random() * 10,
    blinkSpeed: 0.015 + Math.random() * 0.025,
    bobPhase: Math.random() * 10,           // 위아래 일렁임 위치
  };
}

const fireflies = [];
for (let i = 0; i < 45; i++) {
  fireflies.push(makeFirefly());
}

function draw() {
  // 투명하게 서서히 지워서 잔상이 남는다 (배경은 CSS 그라데이션이 보임)
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = "source-over";

  for (const f of fireflies) {
    // 방향 바꾸는 속도 자체를 조금씩 흔들어서, 급하게 꺾이지 않고 곡선으로 난다
    f.turn = f.turn * 0.95 + (Math.random() - 0.5) * 0.04;
    f.angle = f.angle + f.turn;
    f.bobPhase = f.bobPhase + 0.03;
    f.x = f.x + Math.cos(f.angle) * f.speed;
    f.y = f.y + Math.sin(f.angle) * f.speed + Math.sin(f.bobPhase) * 0.3;

    // 화면 가장자리에서 반대쪽으로 (여유를 두어 갑자기 튀지 않게)
    const m = f.size;
    if (f.x < -m) f.x = canvas.width + m;
    if (f.x > canvas.width + m) f.x = -m;
    if (f.y < -m) f.y = canvas.height + m;
    if (f.y > canvas.height + m) f.y = -m;

    // 깜빡임: sin을 제곱해서 "어두운 시간이 길고 반짝이는 시간은 짧게"
    f.time = f.time + f.blinkSpeed;
    const s = (Math.sin(f.time) + 1) / 2;
    const brightness = s * s;

    const color = "hsla(" + f.hue + ", 100%, 65%, ";
    const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size);
    glow.addColorStop(0, color + (0.9 * brightness) + ")");
    glow.addColorStop(0.3, color + (0.35 * brightness) + ")");
    glow.addColorStop(1, color + "0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
    ctx.fill();

    // 가운데 하얗게 밝은 점
    ctx.fillStyle = "rgba(255, 255, 220, " + brightness + ")";
    ctx.beginPath();
    ctx.arc(f.x, f.y, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
